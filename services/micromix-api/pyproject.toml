[project]
name = "micromix-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite==0.21.0",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "uvicorn[standard]==0.36.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
