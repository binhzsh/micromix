[project]
name = "micromix-local-inference"
version = "0.1.0"
description = "Local Apple Silicon inference sidecar for MicroMix"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
micromix-inference = "local_inference.main:run"
