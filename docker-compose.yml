name: micromix

services:
  ace-step:
    build:
      context: ./services/ace-step
      args:
        ACESTEP_COMMIT: ${ACESTEP_COMMIT:-dce621408bee8c31b4fcf4811682eb9359e1bc94}
    container_name: micromix-ace-step
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /models/huggingface
      ACESTEP_CHECKPOINT_DIR: /app/checkpoints
      ACESTEP_CONFIG_PATH: acestep-v15-xl-turbo
      ACESTEP_CONFIG_PATH2: acestep-v15-xl-sft
      ACESTEP_LM_MODEL_PATH: acestep-5Hz-lm-4B
      ACESTEP_OFFLOAD_TO_CPU: "true"
      ACESTEP_OFFLOAD_DIT_TO_CPU: "true"
      ACESTEP_TURBO_REVISION: ${ACESTEP_TURBO_REVISION:-d4a0b288b83ebb7e25a8c0b32c573c22e134e8ee}
      ACESTEP_QUALITY_REVISION: ${ACESTEP_QUALITY_REVISION:-d06de46b4622f781cf07f4a013a67d591ca52819}
      ACESTEP_LM_REVISION: ${ACESTEP_LM_REVISION:-0a3ec94b557aea7d508da38b31cfe7341f6ff737}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${ACE_CACHE_ROOT:-/mnt/fast_pool/fast_models/micromix/ace-step}/checkpoints:/app/checkpoints
      - ${ACE_CACHE_ROOT:-/mnt/fast_pool/fast_models/micromix/ace-step}/huggingface:/models/huggingface
      - ${MICROMIX_DATA_ROOT:-./data}/ace-output:/app/output
    networks: [default, shared_net]
    restart: unless-stopped
    init: true
    shm_size: ${ACE_SHM_SIZE:-24g}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  muscriptor:
    build:
      context: ./services/muscriptor-worker
    container_name: micromix-muscriptor
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /models/huggingface
      MUSCRIPTOR_MODEL: ${MUSCRIPTOR_MODEL:-medium}
      MUSCRIPTOR_DEVICE: ${MUSCRIPTOR_DEVICE:-cuda}
      MUSCRIPTOR_RESTART_AFTER_RELEASE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${MUSCRIPTOR_CACHE_ROOT:-/mnt/fast_pool/fast_models/micromix/muscriptor}:/models
    networks: [default, shared_net]
    restart: unless-stopped
    init: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  rvc-worker:
    build:
      context: ./services/rvc-worker
      args:
        RVC_COMMIT: ${RVC_COMMIT:-main}
    container_name: micromix-rvc
    environment:
      ASSET_ROOT: /data
      VOICE_ROOT: /voices
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${MICROMIX_DATA_ROOT:-./data}/gateway:/data
      - ${VOICE_PROFILE_ROOT:-/mnt/fast_pool/fast_models/micromix/voices}:/voices:ro
    networks: [default, shared_net]
    restart: unless-stopped
    init: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  micromix-api:
    build:
      context: ./services/micromix-api
    container_name: micromix-api
    depends_on:
      - ace-step
      - muscriptor
      - rvc-worker
    ports:
      - "8902:8902"
    environment:
      ACE_URL: http://ace-step:8001
      MUSCRIPTOR_URL: http://muscriptor:8901
      RVC_URL: http://rvc-worker:8910
      VOICE_PROFILE_ROOT: /voices
      GPU_ROUTER_URL: http://gpu-router:9999
      DATA_ROOT: /data
      RETENTION_DAYS: ${MICROMIX_RETENTION_DAYS:-7}
      MAX_UPLOAD_MIB: ${MICROMIX_MAX_UPLOAD_MIB:-200}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${MICROMIX_DATA_ROOT:-./data}/gateway:/data
    networks: [default, shared_net]
    restart: unless-stopped
    init: true

networks:
  shared_net:
    external: true
